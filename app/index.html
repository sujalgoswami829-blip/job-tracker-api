<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobTracker Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { brand: '#4F46E5' }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans h-screen flex overflow-hidden">

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="w-full h-full flex items-center justify-center bg-gradient-to-br from-slate-100 to-slate-200">
        <div class="bg-white p-10 rounded-2xl shadow-xl w-full max-w-md border border-slate-100">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-slate-900">JobTracker<span class="text-brand">Pro</span></h1>
                <p class="text-slate-500 mt-2 text-sm">Manage your career journey.</p>
            </div>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
                    <input type="email" id="email" class="w-full px-4 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand/50 focus:border-brand transition-all" placeholder="you@example.com">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                    <input type="password" id="password" class="w-full px-4 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand/50 focus:border-brand transition-all" placeholder="••••••••">
                </div>
                
                <button onclick="login()" class="w-full bg-brand text-white py-2.5 rounded-lg font-medium hover:bg-indigo-700 transition-colors mt-2">Sign In</button>
                <button onclick="register()" class="w-full bg-slate-100 text-slate-700 py-2.5 rounded-lg font-medium hover:bg-slate-200 transition-colors">Create Account</button>
                <p id="auth-msg" class="text-center text-sm mt-2 font-medium"></p>
            </div>
        </div>
    </div>

    <!-- DASHBOARD SCREEN (Hidden by default) -->
    <div id="dashboard-screen" class="hidden w-full h-full flex">
        
        <!-- Sidebar -->
        <aside class="w-64 bg-white border-r border-slate-200 flex flex-col hidden md:flex">
            <div class="h-16 flex items-center px-6 border-b border-slate-100">
                <span class="text-xl font-bold text-slate-900">JobTracker<span class="text-brand">Pro</span></span>
            </div>
            <nav class="flex-1 p-4 space-y-2">
                <a href="#" class="flex items-center gap-3 px-4 py-2.5 bg-indigo-50 text-brand rounded-lg font-medium">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                    Dashboard
                </a>
            </nav>
            <div class="p-4 border-t border-slate-100">
                <button onclick="logout()" class="flex items-center gap-3 text-slate-500 hover:text-red-500 transition-colors px-4 py-2 w-full text-left font-medium">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                    Sign Out
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col h-full overflow-hidden">
            <!-- Top Header -->
            <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-8">
                <h2 class="text-lg font-semibold text-slate-800">My Applications</h2>
                <button onclick="logout()" class="md:hidden text-red-500 font-medium text-sm">Logout</button>
            </header>

            <div class="flex-1 overflow-y-auto p-8">
                <div class="max-w-5xl mx-auto space-y-8">
                    
                    <!-- Add Job Form -->
                    <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                        <h3 class="text-lg font-semibold text-slate-800 mb-4">Add Application</h3>
                        <form id="add-job-form" onsubmit="addJob(event)" class="flex flex-col md:flex-row gap-4 items-end">
                            <div class="flex-1 w-full">
                                <label class="block text-xs font-medium text-slate-500 mb-1">Company</label>
                                <input type="text" id="company" required class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-brand/50 focus:border-brand text-sm" placeholder="e.g. Google">
                            </div>
                            <div class="flex-1 w-full">
                                <label class="block text-xs font-medium text-slate-500 mb-1">Role</label>
                                <input type="text" id="role" required class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-brand/50 focus:border-brand text-sm" placeholder="e.g. Backend Engineer">
                            </div>
                            <div class="w-full md:w-48">
                                <label class="block text-xs font-medium text-slate-500 mb-1">Status</label>
                                <select id="status" class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-brand/50 focus:border-brand text-sm bg-white">
                                    <option value="Applied">Applied</option>
                                    <option value="Interview">Interview</option>
                                    <option value="Offer">Offer</option>
                                    <option value="Rejected">Rejected</option>
                                </select>
                            </div>
                            <button type="submit" class="w-full md:w-auto bg-brand text-white px-6 py-2 rounded-lg font-medium hover:bg-indigo-700 transition-colors h-[38px] text-sm">Add</button>
                        </form>
                    </div>

                    <!-- Jobs List -->
                    <div>
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="text-lg font-semibold text-slate-800">Recent Applications</h3>
                            <span id="job-count" class="bg-slate-200 text-slate-700 py-1 px-3 rounded-full text-xs font-bold">0 Total</span>
                        </div>
                        
                        <div id="jobs-list" class="space-y-3">
                            <!-- Jobs will appear here -->
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        let token = localStorage.getItem("token");

        function showDashboard() {
            document.getElementById("login-screen").classList.add("hidden");
            document.getElementById("dashboard-screen").classList.remove("hidden");
            loadJobs();
        }

        function logout() {
            localStorage.removeItem("token");
            token = null;
            location.reload();
        }

        async function register() {
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const msg = document.getElementById("auth-msg");
            
            const res = await fetch("/register", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({email, password})
            });
            if(res.ok) {
                msg.innerText = "Account created! Please sign in.";
                msg.className = "text-center text-sm mt-2 font-medium text-green-600";
            } else {
                msg.innerText = "Registration failed. Email might exist.";
                msg.className = "text-center text-sm mt-2 font-medium text-red-500";
            }
        }

        async function login() {
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const msg = document.getElementById("auth-msg");
            
            const formData = new URLSearchParams();
            formData.append("username", email);
            formData.append("password", password);

            const res = await fetch("/login", {
                method: "POST",
                body: formData
            });
            
            if(res.ok) {
                const data = await res.json();
                token = data.access_token;
                localStorage.setItem("token", token);
                showDashboard();
            } else {
                msg.innerText = "Invalid email or password.";
                msg.className = "text-center text-sm mt-2 font-medium text-red-500";
            }
        }

        async function loadJobs() {
            const res = await fetch("/jobs/", {
                headers: {"Authorization": `Bearer ${token}`}
            });
            if(res.ok) {
                const jobs = await res.json();
                const container = document.getElementById("jobs-list");
                const counter = document.getElementById("job-count");
                
                container.innerHTML = "";
                counter.innerText = `${jobs.length} Total`;
                
                if(jobs.length === 0) {
                    container.innerHTML = `<div class="text-center py-10 bg-white rounded-xl border border-slate-200 border-dashed"><p class="text-slate-500">No applications yet. Add your first one above.</p></div>`;
                    return;
                }

                jobs.forEach(job => {
                    let badgeColor = "";
                    if(job.status === "Applied") badgeColor = "bg-blue-100 text-blue-700";
                    if(job.status === "Interview") badgeColor = "bg-amber-100 text-amber-700";
                    if(job.status === "Offer") badgeColor = "bg-emerald-100 text-emerald-700";
                    if(job.status === "Rejected") badgeColor = "bg-red-100 text-red-700";

                    container.innerHTML += `
                        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 hover:border-brand/30 transition-colors">
                            <div>
                                <h4 class="font-semibold text-slate-900">${job.company}</h4>
                                <p class="text-sm text-slate-500">${job.role}</p>
                            </div>
                            <div class="flex items-center gap-4 w-full sm:w-auto justify-between sm:justify-end">
                                <span class="px-2.5 py-1 rounded-full text-xs font-bold ${badgeColor}">${job.status}</span>
                                <button onclick="deleteJob(${job.id})" class="text-slate-400 hover:text-red-500 transition-colors">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                </button>
                            </div>
                        </div>
                    `;
                });
            }
        }

        async function addJob(e) {
            e.preventDefault();
            const company = document.getElementById("company").value;
            const role = document.getElementById("role").value;
            const status = document.getElementById("status").value;

            const res = await fetch("/jobs/", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${token}`
                },
                body: JSON.stringify({company, role, status})
            });
            if(res.ok) {
                loadJobs();
                document.getElementById("add-job-form").reset();
            }
        }

        async function deleteJob(id) {
            await fetch(`/jobs/${id}`, {
                method: "DELETE",
                headers: {"Authorization": `Bearer ${token}`}
            });
            loadJobs();
        }

        if(token) {
            showDashboard();
        }
    </script>
</body>
</html>
